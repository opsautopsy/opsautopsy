[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opsautopsy"
version = "0.1.0"
description = "Kubernetes post-incident forensics and timeline reconstruction"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
  { name = "Nikhil V" }
]

dependencies = [
  "psycopg2-binary>=2.9"
]

[project.scripts]
opsautopsy = "opsautopsy.cli:main"

[tool.setuptools]
packages = ["opsautopsy"]

[tool.setuptools.package-data]
opsautopsy = ["queries/*.sql"]
